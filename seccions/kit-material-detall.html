<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Historial del kit | CF Cardona</title><script src="../assets/js/top-nav.js" defer></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f5f9;--border:#e2e8f0;--text:#172033;--muted:#64748b;--red:#d91d1d}*{box-sizing:border-box;font-family:'Inter',sans-serif}body{margin:0;padding:2rem;background:var(--bg);color:var(--text)}.page{max-width:960px;margin:auto}.back{display:inline-flex;margin-bottom:1rem;color:#334155;text-decoration:none;font-size:.8rem;font-weight:800}.hero,.card{background:#fff;border:1px solid var(--border);border-radius:1rem;box-shadow:0 4px 14px #0f172a0d}.hero{border-top:10px solid var(--kit-color,#64748b);padding:1.25rem;margin-bottom:1rem;background:linear-gradient(135deg,var(--kit-soft,#f8fafc),#fff)}.hero-line{display:flex;align-items:center;justify-content:space-between;gap:1rem}.identity{display:flex;align-items:center;gap:.75rem}.dot{width:40px;height:40px;border-radius:50%;background:var(--kit-color);border:4px solid #fff;box-shadow:0 0 0 1px #33415544}.hero h1{font-size:1.35rem;margin:0}.type{display:inline-block;margin-top:.3rem;padding:.2rem .5rem;border-radius:999px;background:#e2e8f0;font-size:.68rem;font-weight:800}.card{padding:1.15rem;margin-bottom:1rem}.card h2{font-size:1rem;color:var(--red);margin:0 0 .85rem;padding-bottom:.65rem;border-bottom:2px solid #fee2e2}.composition{display:flex;flex-wrap:wrap;gap:.5rem}.material-pill{padding:.55rem .7rem;border-radius:.65rem;background:#f8fafc;border:1px solid var(--border);font-size:.78rem}.material-pill strong{color:#1d4ed8}.timeline{display:grid;gap:.8rem}.session{border:1px solid var(--border);border-left:5px solid #16a34a;border-radius:.8rem;padding:.9rem;background:#fff}.session.open{border-left-color:#2563eb}.session.issue{border-left-color:#dc2626;background:#fffafa}.session-head{display:flex;justify-content:space-between;align-items:flex-start;gap:.8rem}.session-title{font-weight:800;font-size:.9rem}.status{padding:.22rem .5rem;border-radius:999px;background:#dcfce7;color:#166534;font-size:.65rem;font-weight:800;text-transform:uppercase}.status.oberta{background:#dbeafe;color:#1d4ed8}.status.incidencia{background:#fee2e2;color:#991b1b}.meta{font-size:.74rem;color:var(--muted);line-height:1.55;margin-top:.35rem}.movement{display:grid;grid-template-columns:1fr 1fr;gap:.65rem;margin-top:.75rem}.movement-box{background:#f8fafc;border-radius:.65rem;padding:.65rem;font-size:.73rem;line-height:1.55}.movement-box strong{display:block;color:#334155;margin-bottom:.18rem}.items{margin-top:.7rem;border-top:1px solid var(--border);padding-top:.55rem}.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.5rem;padding:.45rem 0;border-bottom:1px solid #f1f5f9;font-size:.75rem}.item:last-child{border-bottom:0}.numbers{font-weight:800;white-space:nowrap}.incident{grid-column:1/-1;padding:.45rem .55rem;background:#fef2f2;color:#991b1b;border-radius:.5rem;font-size:.7rem}.shared-label{margin:.65rem 0 .15rem;font-size:.7rem;font-weight:800;color:#475569;text-transform:uppercase}.empty{text-align:center;padding:1.2rem;border:1px dashed #cbd5e1;border-radius:.7rem;color:var(--muted);font-size:.8rem}.error{padding:1rem;background:#fef2f2;color:#991b1b;border:1px solid #fecaca;border-radius:.7rem;font-weight:700}@media(max-width:650px){body{padding:.8rem}.hero,.card{padding:.9rem}.movement{grid-template-columns:1fr}.session-head{flex-direction:column}.hero h1{font-size:1.15rem}}
.session-actions{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}.status.tancada_incidencia{background:#fee2e2;color:#991b1b}.admin-unlock{display:none;border:0;border-radius:.5rem;padding:.38rem .55rem;background:#7c2d12;color:#fff;font-size:.68rem;font-weight:800;cursor:pointer}.cf-material-admin .admin-unlock{display:inline-flex}
.history-tools{display:none;justify-content:flex-end;margin-bottom:.8rem}.cf-material-admin .history-tools{display:flex}.delete-history{border:1px solid #fecaca;border-radius:.6rem;padding:.55rem .75rem;background:#fff;color:#b91c1c;font-size:.72rem;font-weight:800;cursor:pointer}.delete-history:hover{background:#fef2f2}.delete-history:disabled{opacity:.45;cursor:not-allowed}
</style></head>
<body><main class="page"><a class="back" href="material.html">← Tornar a la gestió de material</a><div class="history-tools"><button id="delete-history" class="delete-history" type="button" disabled>🗑 Esborrar historial del kit</button></div><div id="content"><div class="card">Carregant historial...</div></div></main>
<script>
const kitId=Number(new URLSearchParams(location.search).get('kitId'));const content=document.getElementById('content');
const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');const norm=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
function colors(name){const c={vermell:['#dc2626','#fef2f2'],blau:['#2563eb','#eff6ff'],groc:['#eab308','#fefce8'],verd:['#16a34a','#f0fdf4'],blanc:['#f8fafc','#f8fafc'],negre:['#111827','#f1f5f9'],taronja:['#f97316','#fff7ed'],lila:['#9333ea','#faf5ff']};return c[norm(name)]||['#64748b','#f8fafc']}
function dateTime(value){return value?new Date(value).toLocaleString('ca-ES',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'Pendent'}
function itemRows(items,shared=false){return items.map(i=>{const collected=Number(i.cantidad_recollida||0),returned=Number(i.cantidad_retornada||0),notes=[i.incidencia_recollida,i.incidencia_retorn].filter(Boolean);return`<div class="item"><span>${esc(i.material_nom)}</span><span class="numbers">${collected} rec. · ${returned} torn.</span>${notes.length?`<div class="incident">⚠ ${esc(notes.join(' · '))}</div>`:''}</div>`}).join('')}
function additionRows(items){return items.map(i=>`<div class="item"><span>${esc(i.material_nom)}<br><small>${dateTime(i.data_recollida)} · ${esc(i.staff_nom)}</small></span><span class="numbers">＋ ${i.cantidad} u.</span></div>`).join('')}
function render(data){document.getElementById('delete-history').disabled=!data.sessions.length;const kit=data.kit,[color,soft]=colors(kit.color);document.title=`Kit ${kit.color} | CF Cardona`;content.innerHTML=`<header class="hero" style="--kit-color:${color};--kit-soft:${soft}"><div class="hero-line"><div class="identity"><span class="dot"></span><div><h1>Kit ${esc(kit.color)}</h1><span class="type">${esc(kit.tipus)}</span></div></div><strong>${data.sessions.length} moviments</strong></div></header><section class="card"><h2>Composició actual</h2><div class="composition">${kit.materials.length?kit.materials.map(i=>`<span class="material-pill">${esc(i.material_nom)} · <strong>${i.cantidad} u.</strong></span>`).join(''):'<div class="empty">Kit sense material assignat.</div>'}</div></section><section class="card"><h2>Recollides i retorns</h2><div class="timeline">${data.sessions.length?data.sessions.map(s=>{const active=['oberta','incidencia'].includes(s.estat),hasIssue=String(s.estat).includes('incidencia');return`<article class="session ${hasIssue?'issue':s.estat==='oberta'?'open':''}"><div class="session-head"><div><div class="session-title">${esc(s.equip_nom)}</div><div class="meta">Sessió #${s.id}${hasIssue?` · Darrera incidència: ${dateTime(s.data_actualitzacio)}`:''}</div></div><div class="session-actions"><span class="status ${esc(s.estat)}">${esc(s.estat.replace(/_/g,' '))}</span>${active?`<button class="admin-unlock" data-session="${s.id}">Desbloquejar kit</button>`:''}</div></div><div class="movement"><div class="movement-box"><strong>↗ Recollida</strong>${dateTime(s.data_recollida)}<br>${esc(s.staff_recollida_nom)}</div><div class="movement-box"><strong>↩ Retorn</strong>${dateTime(s.data_retorn)}<br>${esc(s.staff_retorn_nom||'Encara no retornat')}</div></div><div class="items">${itemRows(s.kit_items)}${s.material_compartit.length?`<div class="shared-label">Material compartit de la sessió</div>${itemRows(s.material_compartit,true)}`:''}${(s.ampliacions||[]).length?`<div class="shared-label">Material afegit durant la sessió</div>${additionRows(s.ampliacions)}`:''}</div></article>`}).join(''):'<div class="empty">Aquest kit encara no té moviments registrats.</div>'}</div></section>`;content.querySelectorAll('.admin-unlock').forEach(button=>button.addEventListener('click',()=>unlockKit(button.dataset.session)))}
async function unlockKit(sessionId){if(!confirm('Vols desbloquejar aquest kit i donar per retornat tot el material pendent?'))return;const motiu=prompt('Motiu del desbloqueig administratiu:','Retorn no registrat per l’equip');if(motiu===null)return;try{const r=await fetch('/api/material/admin/desbloquejar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessio_id:Number(sessionId),motiu:motiu.trim()||'Retorn no registrat per l’equip'})}),t=await r.text();let d={};try{d=JSON.parse(t)}catch(_){}if(!r.ok)throw new Error(d.details||d.error||t);await load()}catch(e){alert(e.message||'No s’ha pogut desbloquejar el kit.')}}
async function deleteHistory(){if(!confirm('Vols esborrar definitivament totes les recollides, retorns i incidències d’aquest kit? Les sessions actives també s’eliminaran. Aquesta acció no es pot desfer.'))return;const button=document.getElementById('delete-history'),label=button.textContent;button.disabled=true;button.textContent='Esborrant historial...';try{const r=await fetch(`/api/material/admin/kits/${kitId}/historial`,{method:'DELETE'}),t=await r.text();let d={};try{d=JSON.parse(t)}catch(_){}if(!r.ok)throw new Error(d.details||d.error||t);await load()}catch(e){alert(e.message||'No s’ha pogut esborrar l’historial.');button.disabled=false}finally{button.textContent=label}}
async function load(){if(!kitId){content.innerHTML='<div class="error">No s’ha indicat cap kit.</div>';return}try{const r=await fetch(`/api/material/kits/${kitId}`),t=await r.text();let d={};try{d=JSON.parse(t)}catch(_){}if(!r.ok)throw new Error(d.details||d.error||t);render(d)}catch(e){content.innerHTML=`<div class="error">${esc(e.message||'No s’ha pogut carregar el kit.')}</div>`}}load();
document.getElementById('delete-history').addEventListener('click',deleteHistory);
</script></body></html>
