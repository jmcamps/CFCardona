<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>Moviment de material | CF Cardona</title>
    <script src="../assets/js/top-nav.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root{--red:#d91d1d;--green:#16a34a;--blue:#2563eb;--bg:#f1f5f9;--border:#e2e8f0;--text:#172033;--muted:#64748b;}
        *{box-sizing:border-box;font-family:'Inter',sans-serif}body{margin:0;background:var(--bg);color:var(--text);padding:1rem;min-height:100vh}.page{max-width:960px;margin:auto}.flow{max-width:680px;margin:auto}.mode-tabs{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;background:#fff;padding:.55rem;border:1px solid var(--border);border-radius:1rem;margin-bottom:1rem;position:sticky;top:.5rem;z-index:20;box-shadow:0 5px 18px #0f172a18}.mode-tab{padding:.9rem .5rem;border:0;border-radius:.75rem;font-weight:800;font-size:.9rem;background:#f1f5f9;color:#475569;cursor:pointer}.mode-tab.active.collect{background:#dcfce7;color:#166534}.mode-tab.active.return{background:#dbeafe;color:#1e40af}.hero{border-radius:1rem;padding:1.25rem;margin-bottom:1rem;color:#fff;background:linear-gradient(135deg,#15803d,#22c55e);box-shadow:0 8px 25px #1665342d}.hero.return{background:linear-gradient(135deg,#1d4ed8,#3b82f6)}.hero h1{font-size:1.35rem;margin:0 0 .35rem}.hero p{font-size:.84rem;margin:0;opacity:.92;line-height:1.45}.card{background:#fff;border:1px solid var(--border);border-radius:1rem;padding:1rem;margin-bottom:1rem;box-shadow:0 4px 14px #0f172a0d}.step-title{display:flex;align-items:center;gap:.65rem;font-size:.96rem;font-weight:800;margin-bottom:.85rem}.step-number{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#fee2e2;color:#b91c1c;font-size:.78rem}.field{margin-bottom:.8rem}.field:last-child{margin-bottom:0}label{display:block;font-size:.73rem;font-weight:800;color:#475569;margin-bottom:.35rem}select,input,textarea{width:100%;border:1px solid #cbd5e1;border-radius:.7rem;background:#fff;padding:.78rem;font-size:16px;color:var(--text)}textarea{min-height:72px;resize:vertical}select:focus,input:focus,textarea:focus{outline:3px solid #bfdbfe;border-color:var(--blue)}button{font-size:.85rem;font-weight:800;border:0;border-radius:.75rem;padding:.8rem;cursor:pointer}.big-choice{display:grid;grid-template-columns:1fr 1fr;gap:.65rem}.big-choice button{min-height:82px;font-size:.92rem}.ok-btn{background:#16a34a;color:#fff;box-shadow:0 5px 14px #16a34a33}.issue-btn{background:#dc2626;color:#fff;box-shadow:0 5px 14px #dc262633}.primary-btn{width:100%;background:#172033;color:#fff;padding:1rem;font-size:1rem}.secondary-btn{background:#e2e8f0;color:#334155}.hidden{display:none!important}.kit-preview{border:2px solid var(--kit-color,#64748b);border-radius:.85rem;overflow:hidden;margin-bottom:.8rem}.kit-head{display:flex;align-items:center;justify-content:space-between;padding:.85rem;background:var(--kit-soft,#f8fafc)}.kit-name{display:flex;align-items:center;gap:.55rem;font-weight:800}.dot{width:26px;height:26px;border-radius:50%;background:var(--kit-color);border:3px solid #fff;box-shadow:0 0 0 1px #33415555}.pill{padding:.22rem .5rem;border-radius:999px;background:#e2e8f0;font-size:.66rem;font-weight:800}.contents{padding:.65rem .85rem}.content-row,.shared-row,.return-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.55rem;align-items:center;padding:.65rem 0;border-bottom:1px solid #f1f5f9}.content-row:last-child,.shared-row:last-child,.return-row:last-child{border-bottom:0}.item-name{font-size:.84rem;font-weight:700}.item-meta{font-size:.7rem;color:var(--muted);margin-top:.15rem}.count{font-size:.82rem;font-weight:800;color:#334155}.detail-row{background:#fff7ed;border:1px solid #fed7aa;border-radius:.75rem;padding:.75rem;margin-bottom:.6rem}.detail-grid{display:grid;grid-template-columns:90px 1fr;gap:.55rem;margin-top:.55rem}.detail-grid input{padding:.6rem}.shared-row{grid-template-columns:minmax(0,1fr) 90px}.shared-row input{text-align:center}.availability{color:#059669;font-weight:800}.blocked{color:#dc2626}.holder{margin-top:.4rem;padding:.45rem .55rem;border-radius:.55rem;background:#fef2f2;color:#991b1b;font-size:.69rem;font-weight:700}.session-card{width:100%;text-align:left;background:#fff;border:2px solid var(--border);padding:.9rem;margin-bottom:.65rem}.session-card.selected{border-color:var(--blue);background:#eff6ff}.session-top{display:flex;justify-content:space-between;gap:.5rem}.session-kit{font-size:1rem;font-weight:800}.session-meta{font-size:.74rem;color:var(--muted);margin-top:.35rem;line-height:1.5}.status{padding:.22rem .5rem;border-radius:999px;background:#dcfce7;color:#166534;font-size:.64rem}.status.issue{background:#fee2e2;color:#991b1b}.return-row{grid-template-columns:minmax(0,1fr) 82px}.return-row input{text-align:center}.reason{grid-column:1/-1}.empty{text-align:center;padding:1rem;color:var(--muted);border:1px dashed #cbd5e1;border-radius:.7rem;font-size:.8rem}.feedback{position:fixed;left:1rem;right:1rem;bottom:1rem;max-width:640px;margin:auto;padding:.85rem;border-radius:.75rem;color:#fff;font-size:.82rem;font-weight:800;z-index:50;box-shadow:0 8px 24px #0f172a44}.feedback.error{background:#b91c1c}.feedback.success{background:#15803d}.loading{opacity:.55;pointer-events:none}@media(max-width:480px){body{padding:.7rem}.card{padding:.85rem}.big-choice{grid-template-columns:1fr}.hero{padding:1rem}.detail-grid{grid-template-columns:78px 1fr}.mode-tab{font-size:.8rem}.return-row{grid-template-columns:minmax(0,1fr) 76px}}
        .start-btn{min-height:105px!important;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;text-align:left;gap:.3rem;color:#fff}.start-btn strong{font-size:1rem}.start-btn small{font-size:.72rem;line-height:1.4;opacity:.9}.start-new{background:linear-gradient(135deg,#15803d,#22c55e)}.start-existing{background:linear-gradient(135deg,#1d4ed8,#3b82f6)}.active-session-list{display:grid;gap:.65rem}.extra-staff{margin-top:.8rem;padding:.8rem;border-radius:.75rem;background:#eff6ff;border:1px solid #bfdbfe}.shared-label{margin:.75rem 0 .2rem;font-size:.7rem;font-weight:800;color:#475569;text-transform:uppercase;letter-spacing:.04em}.kit-collect-row{grid-template-columns:minmax(0,1fr) 112px}.kit-collect-field label{font-size:.64rem;text-align:center}.kit-collect-field input{padding:.58rem;text-align:center;font-weight:800}

        /* Paleta corporativa per al flux ràpid de material */
        .mode-tabs{background:#fff7f8;border-color:#fecdd3;box-shadow:0 5px 18px #991b1b18}
        .mode-tab{background:#ffe4e6;color:#b91c1c;border:1px solid #fecdd3;transition:background .18s ease,color .18s ease,transform .18s ease}
        .mode-tab.active.collect,.mode-tab.active.return{background:linear-gradient(135deg,#b91c1c,#dc2626);color:#fff;border-color:#b91c1c;box-shadow:0 5px 14px #b91c1c35}
        .mode-tab:active,.start-btn:active,.primary-btn:active{transform:scale(.98)}
        .hero,.hero.return{color:#b91c1c;background:linear-gradient(135deg,#ffe4e6,#fff1f2);border:1px solid #fecdd3;box-shadow:0 8px 25px #991b1b1f}
        .hero p{color:#7f1d1d;opacity:1}
        .start-new{background:linear-gradient(135deg,#b91c1c,#dc2626);color:#fff;box-shadow:0 6px 16px #b91c1c35}
        .start-existing{background:linear-gradient(135deg,#ffe4e6,#fff1f2);color:#b91c1c;border:2px solid #fda4af;box-shadow:0 6px 16px #9f12391f}
        .start-existing small{color:#7f1d1d;opacity:1}
        .primary-btn{background:linear-gradient(135deg,#b91c1c,#dc2626);box-shadow:0 6px 16px #b91c1c35}
        .session-card.selected{border-color:#dc2626;background:#fff1f2;box-shadow:0 4px 12px #991b1b18}
        .extra-staff{background:#fff1f2;border-color:#fecdd3}
        select:focus,input:focus,textarea:focus{outline-color:#fecdd3;border-color:#dc2626}
        .mode-tab:focus-visible,.start-btn:focus-visible,.primary-btn:focus-visible{outline:3px solid #fda4af;outline-offset:2px}
        .return-reason-wrap{grid-column:1/-1;padding:.7rem;border-radius:.7rem;background:#fff1f2;border:1px solid #fecdd3}
        .return-reason-wrap label{color:#b91c1c}
        .return-reason-wrap textarea{background:#fff;min-height:68px}
        .return-session-context{padding:.7rem .85rem;background:#fff7f8;border-bottom:1px solid #ffe4e6;font-size:.75rem;color:#7f1d1d;line-height:1.5}
        .return-shared-preview{--kit-color:#dc2626;--kit-soft:#fff1f2}
    </style>
</head>
<body>
<main class="page"><div class="flow" id="flow">
    <div class="mode-tabs"><button id="tab-collect" class="mode-tab collect">↗️ Recollir</button><button id="tab-return" class="mode-tab return">↩️ Tornar</button></div>
    <header class="hero" id="hero"><h1 id="hero-title"></h1><p id="hero-copy"></p></header>
    <div id="feedback" class="feedback hidden" role="status"></div>

    <section class="card" id="pickup-start">
        <div class="step-title"><span class="step-number">1</span>Què vols fer?</div>
        <div class="big-choice"><button class="start-btn start-new" id="start-new"><strong>＋ Sessió nova</strong><small>Recollir un kit i el material compartit necessari.</small></button><button class="start-btn start-existing" id="start-existing"><strong>↗ Afegir material</strong><small>Ampliar una sessió d’entrenament que ja està activa.</small></button></div>
    </section>

    <section class="card" id="identify-card">
        <div class="step-title"><span class="step-number" id="identify-step-number">1</span><span id="identify-title">Identifica la sessió</span></div>
        <div class="field"><label for="team-select">Equip</label><select id="team-select"><option value="">Selecciona l’equip...</option></select></div>
        <div class="field"><label for="staff-select">Qui recull o torna el material?</label><select id="staff-select" disabled><option value="">Selecciona primer l’equip...</option></select></div>
    </section>

    <div id="collect-flow">
        <section class="card hidden" id="active-pickup-step"><div class="step-title"><span class="step-number">2</span>Escull una sessió activa</div><div id="active-pickup-list" class="active-session-list"></div><div id="extra-staff-wrap" class="extra-staff hidden"><label for="extra-staff-select">Qui agafa el material ara?</label><select id="extra-staff-select"></select></div></section>
        <section class="card hidden" id="kit-step">
            <div class="step-title"><span class="step-number">3</span>Escull el kit</div>
            <div class="field"><label for="kit-select">Kit d’entrenament</label><select id="kit-select"><option value="">Selecciona un kit...</option></select></div>
            <div id="kit-check" class="hidden"><div id="kit-preview"></div><button class="ok-btn" id="kit-confirm" style="width:100%;padding:1rem;font-size:1rem">✓ Confirmar kit</button></div>
        </section>
        <section class="card hidden" id="shared-step"><div class="step-title"><span class="step-number" id="shared-step-number">4</span>Material compartit</div><p id="shared-copy" style="font-size:.76rem;color:var(--muted);margin:-.35rem 0 .7rem">Indica només les unitats que agafes, a més del kit.</p><div id="shared-list"></div><button id="collect-submit" class="primary-btn" style="margin-top:.8rem">Confirmar recollida</button></section>
    </div>

    <div id="return-flow" class="hidden">
        <section class="card"><div class="step-title"><span class="step-number">1</span>Escull la sessió activa</div><div id="sessions-list"><div class="empty">Carregant sessions actives...</div></div></section>
        <section class="card hidden" id="return-check"><div class="step-title"><span class="step-number">2</span>Retorna el kit</div><div id="return-kit-preview"></div><button id="return-kit-confirm" class="ok-btn" style="width:100%;padding:1rem;font-size:1rem">✓ Confirmar kit</button></section>
        <section class="card hidden" id="return-shared-step"><div class="step-title"><span class="step-number">3</span>Material compartit</div><p style="font-size:.76rem;color:var(--muted);margin:-.35rem 0 .7rem">Confirma les unitats de material compartit que tornes.</p><div id="return-shared-list"></div><button id="return-submit" class="primary-btn" style="margin-top:.8rem">Confirmar retorn</button></section>
    </div>
</div></main>
<script>
const API='/api/material/moviments';
let data={inventory:{materials:[],kits:[]},sessions:[],equips:[],staff:[],staff_assignments:[]};
let mode=new URLSearchParams(location.search).get('mode')==='retorn'?'retorn':'recollida';
let selectedKit=null,kitMode='',selectedSession=null,selectedPickupSession=null,pickupStartMode='';
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const norm=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
function colorInfo(name){const c={vermell:['#dc2626','#fef2f2'],blau:['#2563eb','#eff6ff'],groc:['#eab308','#fefce8'],verd:['#16a34a','#f0fdf4'],blanc:['#f8fafc','#f8fafc'],negre:['#111827','#f1f5f9'],taronja:['#f97316','#fff7ed'],lila:['#9333ea','#faf5ff']};return c[norm(name)]||['#64748b','#f8fafc']}
function material(id){return data.inventory.materials.find(x=>Number(x.id)===Number(id))||{nom:'Material',compartit_disponible:0}}
function kit(id){return data.inventory.kits.find(x=>Number(x.id)===Number(id))}
function teamOrder(team){const name=norm(team.name||team.nom).replace(/\s+/g,' ');const ranks={'primer equip':0,'filial':1,'minis':10,'minis-s7':10,'s7':11,'s8':12,'s9':13,'s10':14,'s11':15,'s12':16,'s13':17,'s14':18,'s15':19,'s16':20,'s16 (cadet)':20,'juvenil masculi - a':21,'juvenil masculi a':21,'juvenil masculi - b':22,'juvenil masculi b':22,'alevi femeni':40,'infantil-cadet femeni':41,'infantil cadet femeni':41,'juvenil femeni':42};if(ranks[name]!==undefined)return ranks[name];const age=name.match(/^s(\d+)/);if(age)return 4+Number(age[1]);if(name.includes('mascul'))return 30;if(name.includes('femen'))return 50;return 100}
function orderedTeams(){return [...data.equips].sort((a,b)=>teamOrder(a)-teamOrder(b)||String(a.name||a.nom).localeCompare(String(b.name||b.nom),'ca'))}
function activePickupSessions(teamId=null){const team=Number(teamId);return data.sessions.filter(s=>!team||Number(s.equip_id)===team)}
function sessionKitLabel(session){const currentKit=kit(session.kit_entreno_id)||{color:'Kit',tipus:''};return `${currentKit.color} · ${currentKit.tipus}`}
function teamName(id){const team=data.equips.find(e=>Number(e.id)===Number(id));return team?String(team.name||team.nom):`Equip ${id}`}
async function request(url,options={}){const r=await fetch(url,options),t=await r.text();let j={};try{j=t?JSON.parse(t):{}}catch(_){}if(!r.ok)throw new Error(j.details||j.error||t||`HTTP ${r.status}`);return j}
function notify(text,type='success'){const e=$('feedback');e.textContent=text;e.className=`feedback ${type}`;clearTimeout(notify.t);notify.t=setTimeout(()=>e.classList.add('hidden'),4500)}
function setBusy(value){$('flow').classList.toggle('loading',value)}
async function load(){try{setBusy(true);data=await request(API);renderBase()}catch(e){notify(e.message,'error')}finally{setBusy(false)}}
function setMode(next){mode=next;history.replaceState(null,'',`?mode=${mode}`);selectedKit=null;selectedSession=null;selectedPickupSession=null;pickupStartMode='';kitMode='';$('kit-select').value='';$('kit-check').classList.add('hidden');$('shared-step').classList.add('hidden');$('return-check').classList.add('hidden');$('return-shared-step').classList.add('hidden');$('return-shared-list').innerHTML='';renderBase()}
function renderBase(){
 $('tab-collect').classList.toggle('active',mode==='recollida');$('tab-return').classList.toggle('active',mode==='retorn');$('collect-flow').classList.toggle('hidden',mode!=='recollida');$('return-flow').classList.toggle('hidden',mode!=='retorn');$('hero').classList.toggle('return',mode==='retorn');
 $('hero-title').textContent=mode==='recollida'?'Recollir material':'Torna el material ràpidament';$('hero-copy').textContent=mode==='recollida'?'Inicia una sessió nova o afegeix material a una que ja està activa.':'Selecciona la sessió, confirma què torna i informa de qualsevol incidència.';document.title=`${mode==='recollida'?'Recollir':'Tornar'} material | CF Cardona`;
 const current=$('team-select').value,teams=orderedTeams();$('team-select').innerHTML='<option value="">Selecciona l’equip...</option>'+teams.map(e=>`<option value="${e.id}">${esc(e.name||e.nom)}</option>`).join('');if(teams.some(e=>String(e.id)===current))$('team-select').value=current;renderStaff();renderKits();renderSessions();renderPickupStart();
}
function renderStaff(){const team=Number($('team-select').value);const ids=new Set(data.staff_assignments.filter(a=>Number(a.equip_id)===team).map(a=>Number(a.staff_membre_id)));const rows=data.staff.filter(s=>ids.has(Number(s.id))&&s.actiu!==false);const old=$('staff-select').value;$('staff-select').disabled=!team;$('staff-select').innerHTML=`<option value="">${team?'Selecciona el membre del staff...':'Selecciona primer l’equip...'}</option>`+rows.map(s=>`<option value="${s.id}">${esc(s.nom)}</option>`).join('');if(rows.some(s=>String(s.id)===old))$('staff-select').value=old}
function renderPickupStart(){const collecting=mode==='recollida';$('pickup-start').classList.toggle('hidden',!collecting);$('identify-card').classList.toggle('hidden',!collecting||pickupStartMode!=='new');$('active-pickup-step').classList.toggle('hidden',!collecting||pickupStartMode!=='existing');$('kit-step').classList.toggle('hidden',!collecting||pickupStartMode!=='new');$('identify-step-number').textContent='2';$('identify-title').textContent='Identifica la nova sessió';if(collecting&&pickupStartMode==='existing')renderActivePickupSessions()}
function choosePickupStart(next){pickupStartMode=next;selectedKit=null;selectedPickupSession=null;kitMode='';$('team-select').value='';$('staff-select').value='';$('kit-select').value='';$('kit-check').classList.add('hidden');$('shared-step').classList.add('hidden');renderStaff();renderKits();renderPickupStart();if(next==='existing')$('active-pickup-step').scrollIntoView({behavior:'smooth',block:'start'})}
function pickupStaffRows(session){const ids=new Set(data.staff_assignments.filter(a=>Number(a.equip_id)===Number(session.equip_id)).map(a=>Number(a.staff_membre_id)));return data.staff.filter(s=>ids.has(Number(s.id))&&s.actiu!==false)}
function renderActivePickupSessions(){const rows=[...activePickupSessions()].sort((a,b)=>{const ta=data.equips.find(e=>Number(e.id)===Number(a.equip_id))||{},tb=data.equips.find(e=>Number(e.id)===Number(b.equip_id))||{};return teamOrder(ta)-teamOrder(tb)||new Date(b.data_recollida)-new Date(a.data_recollida)});$('active-pickup-list').innerHTML=rows.length?rows.map(s=>`<button class="session-card ${selectedPickupSession&&selectedPickupSession.id===s.id?'selected':''}" data-pickup-session="${s.id}"><div class="session-top"><span class="session-kit">${esc(teamName(s.equip_id))}</span><span class="status ${s.estat==='incidencia'?'issue':''}">${esc(s.estat)}</span></div><div class="session-meta">${esc(sessionKitLabel(s))} · ${esc(s.staff_nom)}<br>${new Date(s.data_recollida).toLocaleString('ca-ES')}</div></button>`).join(''):'<div class="empty">No hi ha cap sessió d’entrenament activa.</div>';document.querySelectorAll('[data-pickup-session]').forEach(button=>button.onclick=()=>selectPickupSession(Number(button.dataset.pickupSession)));if(!selectedPickupSession){$('extra-staff-wrap').classList.add('hidden');return}const staffRows=pickupStaffRows(selectedPickupSession),select=$('extra-staff-select'),old=select.value;select.innerHTML='<option value="">Selecciona el membre del staff...</option>'+staffRows.map(s=>`<option value="${s.id}">${esc(s.nom)}</option>`).join('');const preferred=staffRows.some(s=>Number(s.id)===Number(selectedPickupSession.staff_membre_id))?String(selectedPickupSession.staff_membre_id):old;if(staffRows.some(s=>String(s.id)===preferred))select.value=preferred;$('extra-staff-wrap').classList.remove('hidden')}
function selectPickupSession(id){selectedPickupSession=data.sessions.find(s=>Number(s.id)===Number(id))||null;if(!selectedPickupSession)return;kitMode='loose';$('team-select').value=String(selectedPickupSession.equip_id);renderStaff();renderActivePickupSessions();if($('extra-staff-select').value)openShared()}
function renderKits(){const old=$('kit-select').value,disabled=!$('team-select').value||!$('staff-select').value;$('kit-select').disabled=disabled;$('kit-select').innerHTML=`<option value="">${disabled?'Selecciona equip i staff...':'Selecciona un kit...'}</option>`+data.inventory.kits.map(k=>`<option value="${k.id}" ${k.disponible?'':'disabled'}>${esc(k.color)} · ${esc(k.tipus)}${k.disponible?'':` — el té ${esc(k.holder.staff_nom)}`}</option>`).join('');if(data.inventory.kits.some(k=>String(k.id)===old&&k.disponible))$('kit-select').value=old}
function showKit(){selectedKit=kit($('kit-select').value);selectedPickupSession=null;kitMode='';$('shared-step').classList.add('hidden');if(!selectedKit){$('kit-check').classList.add('hidden');return}$('kit-check').classList.remove('hidden');const [c,s]=colorInfo(selectedKit.color);$('kit-preview').innerHTML=`<div class="kit-preview" style="--kit-color:${c};--kit-soft:${s}"><div class="kit-head"><div class="kit-name"><span class="dot"></span>${esc(selectedKit.color)}</div><span class="pill">${esc(selectedKit.tipus)}</span></div><div class="contents">${selectedKit.materials.length?selectedKit.materials.map(i=>`<div class="content-row kit-collect-row"><div><div class="item-name">${esc(material(i.material_id).nom)}</div><div class="item-meta">(${i.cantidad} unitats esperades)</div></div><div class="kit-collect-field"><label>Unitats recollides</label><input class="kit-collected" data-material="${i.material_id}" data-expected="${i.cantidad}" type="number" min="0" max="${i.cantidad}" step="1" value="${i.cantidad}" inputmode="numeric"></div></div>`).join(''):'<div class="empty">Aquest kit no té material definit.</div>'}</div></div>`}
function validateKitCollection(){for(const input of document.querySelectorAll('.kit-collected')){const expected=Number(input.dataset.expected),actual=Number(input.value);if(!Number.isInteger(actual)||actual<0||actual>expected){notify(`Les unitats recollides han d’estar entre 0 i ${expected}.`,'error');input.focus();return false}}return true}
function confirmKit(){if(!selectedKit){notify('Selecciona un kit.','error');return}if(!validateKitCollection())return;kitMode=[...document.querySelectorAll('.kit-collected')].some(input=>Number(input.value)<Number(input.dataset.expected))?'issue':'ok';openShared()}
function currentPickupStaff(){return Number(kitMode==='loose'?$('extra-staff-select').value:$('staff-select').value)}
function openShared(){if(kitMode==='loose'&&(!selectedPickupSession||!currentPickupStaff())){notify(selectedPickupSession?'Selecciona qui agafa el material.':'Selecciona una sessió activa.','error');return}$('shared-step-number').textContent=kitMode==='loose'?'3':'4';$('shared-copy').textContent=kitMode==='loose'?'Indica les unitats addicionals que necessites durant la sessió.':'Indica només les unitats que agafes, a més del kit.';$('shared-step').classList.remove('hidden');renderShared();$('shared-step').scrollIntoView({behavior:'smooth',block:'start'})}
function renderShared(){const rows=data.inventory.materials.filter(m=>Number(m.compartit_total)>0);$('shared-list').innerHTML=rows.length?rows.map(m=>`<div class="shared-row"><div><div class="item-name">${esc(m.nom)}</div><div class="item-meta"><span class="${m.compartit_disponible?'availability':'blocked'}">${m.compartit_disponible} disponibles</span> de ${m.compartit_total}</div>${m.holders.length?`<div class="holder">${m.holders.map(h=>`${h.cantidad} u. · ${esc(h.staff_nom)} (${esc(h.equip_nom)})`).join('<br>')}</div>`:''}</div><input class="shared-qty" data-material="${m.id}" type="number" min="0" max="${m.compartit_disponible}" value="0" ${m.compartit_disponible?'':'disabled'} aria-label="Unitats de ${esc(m.nom)}"></div>`).join(''):'<div class="empty">No hi ha material compartit definit.</div>'}
function pickupKitItems(){return selectedKit.materials.map(i=>{const input=document.querySelector(`.kit-collected[data-material="${i.material_id}"]`),actual=Number(input.value),missing=Math.max(0,Number(i.cantidad)-actual);return{material_id:i.material_id,cantidad_recollida:actual,incidencia:missing?`Falten ${missing} unitat${missing===1?'':'s'} en recollir el kit`:''}})}
async function submitPickup(){const team=Number($('team-select').value),staff=currentPickupStaff();if(!team||!staff||!kitMode){notify('Completa els passos anteriors.','error');return}if(kitMode!=='loose'&&!selectedKit){notify('Selecciona un kit.','error');return}if(kitMode!=='loose'){if(!validateKitCollection())return;kitMode=[...document.querySelectorAll('.kit-collected')].some(input=>Number(input.value)<Number(input.dataset.expected))?'issue':'ok'}const shared=[...document.querySelectorAll('.shared-qty')].map(i=>({material_id:Number(i.dataset.material),cantidad:Number(i.value)})).filter(i=>i.cantidad>0);if(kitMode==='loose'&&(!selectedPickupSession||!shared.length)){notify(selectedPickupSession?'Indica almenys una unitat de material.':'Selecciona una sessió activa.','error');return}try{setBusy(true);if(kitMode==='loose'){await request(`${API}/material-compartit`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessio_id:selectedPickupSession.id,equip_id:team,staff_membre_id:staff,material_compartit:shared})});notify('Material afegit a la sessió activa.')}else{await request(`${API}/recollida`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({equip_id:team,staff_membre_id:staff,kit_entreno_id:selectedKit.id,kit_items:pickupKitItems(),material_compartit:shared})});notify(kitMode==='issue'?'Recollida registrada amb les mancances del kit.':'Recollida registrada. Bon entrenament!')}selectedPickupSession=null;selectedKit=null;pickupStartMode='';kitMode='';await load();$('team-select').value='';$('kit-select').value='';renderStaff();renderKits();showKit();renderPickupStart()}catch(e){notify(e.message,'error')}finally{setBusy(false)}}
function renderSessions(){const rows=[...data.sessions].sort((a,b)=>{const ta=data.equips.find(e=>Number(e.id)===Number(a.equip_id))||{},tb=data.equips.find(e=>Number(e.id)===Number(b.equip_id))||{};return teamOrder(ta)-teamOrder(tb)||new Date(b.data_recollida)-new Date(a.data_recollida)});$('sessions-list').innerHTML=rows.length?rows.map(s=>{const k=kit(s.kit_entreno_id)||{color:'Kit',tipus:''};return`<button class="session-card ${selectedSession&&selectedSession.id===s.id?'selected':''}" data-return-session="${s.id}"><div class="session-top"><span class="session-kit">${esc(s.equip_nom)}</span><span class="status ${s.estat==='incidencia'?'issue':''}">${esc(s.estat)}</span></div><div class="session-meta">${esc(k.color)} · ${esc(k.tipus)} · ${esc(s.staff_nom)}<br>${new Date(s.data_recollida).toLocaleString('ca-ES')}</div></button>`}).join(''):'<div class="empty">No hi ha cap sessió activa amb material pendent.</div>';document.querySelectorAll('[data-return-session]').forEach(b=>b.onclick=()=>selectSession(Number(b.dataset.returnSession)))}
function pendingReturnItems(items){return items.filter(i=>Math.max(0,Number(i.cantidad_recollida)-Number(i.cantidad_retornada))>0)}
function returnRows(items,type){return pendingReturnItems(items).map(i=>{const pending=Math.max(0,Number(i.cantidad_recollida)-Number(i.cantidad_retornada));const expected=type==='kit'?Number(i.cantidad_esperada||0):Number(i.cantidad_recollida||0);const missingAtPickup=type==='kit'?Math.max(0,expected-Number(i.cantidad_recollida||0)):0;const notes=[i.incidencia_recollida,i.incidencia_retorn].filter(Boolean);return`<div class="content-row kit-collect-row return-item-row" data-type="${type}" data-material="${i.material_id}" data-pending="${pending}"><div><div class="item-name">${esc(material(i.material_id).nom)}</div><div class="item-meta">${type==='kit'?`(${pending} unitats esperades en el retorn · ${expected} al kit)`:`(${pending} unitats esperades en el retorn)`}</div>${missingAtPickup?`<div class="holder">⚠ Ja en faltaven ${missingAtPickup} en recollir el kit${notes.length?`: ${esc(notes.join(' · '))}`:''}</div>`:notes.length?`<div class="holder">⚠ Incidència anterior: ${esc(notes.join(' · '))}</div>`:''}</div><div class="kit-collect-field"><label>Unitats retornades</label><input class="return-qty" type="number" min="0" max="${pending}" step="1" value="${pending}" inputmode="numeric"></div><div class="return-reason-wrap hidden"><label>Motiu de les unitats que no es tornen</label><textarea class="return-reason" placeholder="Explica què ha passat..." disabled></textarea></div></div>`}).join('')}
function syncReturnReason(row){const input=row.querySelector('.return-qty'),wrap=row.querySelector('.return-reason-wrap'),reason=row.querySelector('.return-reason');const show=Number(input.value)<Number(row.dataset.pending);wrap.classList.toggle('hidden',!show);reason.disabled=!show;if(!show)reason.value=''}
function bindReturnRows(container){container.querySelectorAll('.return-item-row').forEach(row=>{const input=row.querySelector('.return-qty');input.addEventListener('input',()=>syncReturnReason(row));syncReturnReason(row)})}
function selectSession(id){selectedSession=data.sessions.find(s=>Number(s.id)===Number(id))||null;if(!selectedSession)return;renderSessions();$('return-shared-step').classList.add('hidden');$('return-shared-list').innerHTML='';const k=kit(selectedSession.kit_entreno_id)||{color:'Kit',tipus:''},[c,s]=colorInfo(k.color);const kitRows=returnRows(selectedSession.kit_items,'kit');const sharedPending=pendingReturnItems(selectedSession.material_compartit);$('return-kit-preview').innerHTML=`<div class="kit-preview" style="--kit-color:${c};--kit-soft:${s}"><div class="kit-head"><div class="kit-name"><span class="dot"></span>${esc(k.color)}</div><span class="pill">${esc(k.tipus)}</span></div><div class="return-session-context"><strong>${esc(selectedSession.equip_nom)}</strong><br>Recollit per ${esc(selectedSession.staff_nom)}</div><div class="contents">${kitRows||'<div class="empty">Aquest kit no té material pendent de retorn.</div>'}</div></div>`;bindReturnRows($('return-kit-preview'));$('return-kit-confirm').textContent=sharedPending.length?'✓ Confirmar kit':'✓ Confirmar retorn';$('return-check').classList.remove('hidden');$('return-check').scrollIntoView({behavior:'smooth',block:'start'})}
function readReturnRows(container,type){const rows=[];for(const row of container.querySelectorAll('.return-item-row')){const pending=Number(row.dataset.pending),actual=Number(row.querySelector('.return-qty').value),reason=row.querySelector('.return-reason').value.trim();if(!Number.isInteger(actual)||actual<0||actual>pending){throw new Error(`Les unitats de ${material(row.dataset.material).nom} han d’estar entre 0 i ${pending}`)}if(actual<pending&&!reason){row.querySelector('.return-reason').focus();throw new Error(`Indica el motiu de ${material(row.dataset.material).nom}`)}rows.push({material_id:Number(row.dataset.material),cantidad_retornada:actual,incidencia:actual<pending?reason:''})}return rows}
function renderReturnShared(){const rows=returnRows(selectedSession.material_compartit,'shared');const total=pendingReturnItems(selectedSession.material_compartit).reduce((sum,item)=>sum+Math.max(0,Number(item.cantidad_recollida)-Number(item.cantidad_retornada)),0);$('return-shared-list').innerHTML=`<div class="kit-preview return-shared-preview"><div class="kit-head"><div class="kit-name"><span class="dot"></span>Material compartit</div><span class="pill">${total} u.</span></div><div class="contents">${rows}</div></div>`;bindReturnRows($('return-shared-list'));$('return-shared-step').classList.remove('hidden');$('return-shared-step').scrollIntoView({behavior:'smooth',block:'start'})}
function confirmReturnKit(){if(!selectedSession)return;try{readReturnRows($('return-kit-preview'),'kit');if(pendingReturnItems(selectedSession.material_compartit).length){renderReturnShared()}else{submitReturn()}}catch(e){notify(e.message,'error')}}
function returnPayload(){return{sessio_id:selectedSession.id,staff_membre_id:selectedSession.staff_membre_id,kit_items:readReturnRows($('return-kit-preview'),'kit'),material_compartit:readReturnRows($('return-shared-list'),'shared')}}
async function submitReturn(){if(!selectedSession)return;try{const payload=returnPayload();setBusy(true);const result=await request(`${API}/retorn`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});notify(result.estat==='tancada_incidencia'?'Retorn amb incidència registrat i existències actualitzades.':'Material retornat correctament i kit actualitzat.');selectedSession=null;await load();$('return-check').classList.add('hidden');$('return-shared-step').classList.add('hidden')}catch(e){notify(e.message,'error')}finally{setBusy(false)}}
$('tab-collect').onclick=()=>setMode('recollida');$('tab-return').onclick=()=>setMode('retorn');$('start-new').onclick=()=>choosePickupStart('new');$('start-existing').onclick=()=>choosePickupStart('existing');$('team-select').onchange=()=>{selectedKit=null;kitMode='';$('kit-select').value='';renderStaff();renderKits();renderSessions();showKit()};$('staff-select').onchange=()=>{selectedKit=null;kitMode='';$('kit-select').value='';renderKits();renderSessions();showKit()};$('extra-staff-select').onchange=()=>{if($('extra-staff-select').value)openShared();else $('shared-step').classList.add('hidden')};$('kit-select').onchange=showKit;$('kit-confirm').onclick=confirmKit;$('collect-submit').onclick=submitPickup;$('return-kit-confirm').onclick=confirmReturnKit;$('return-submit').onclick=submitReturn;load();
</script>
</body></html>
